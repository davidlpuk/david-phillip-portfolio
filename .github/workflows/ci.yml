# Checks every push and pull request. Vercel deploys separately, but its
# build runs the same typecheck, tests and build check, so a failing commit
# never replaces the live site.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build, prerender and verify output
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.2 AA)
        run: pnpm check:a11y
